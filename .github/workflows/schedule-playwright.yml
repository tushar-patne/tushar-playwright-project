name: Playwright Scheduled E2E

on:
  schedule:
    - cron: '0 02 * * 1'  # Mondays at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-playwright
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20' 
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --output=test-results
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 18
      